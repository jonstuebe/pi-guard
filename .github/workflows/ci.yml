name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:install

  live-security:
    name: Live Gondolin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # GitHub-hosted macOS runners do not expose HVF; use software emulation only in live CI tests.
      PI_GUARD_QEMU_ACCEL: ${{ runner.os == 'macOS' && 'tcg' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - run: npm ci
      - run: npm run test:live
      - run: npm run test:live:network
